<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konva Virtual Scrolling Table (with Frozen Rows/Cols): virtual_konva_excel.html</title>
    <!-- Include Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Ensure Konva container and scroll container have the same size */
      #container {
        position: relative;
        width: 90vw;
        height: 80vh;
        margin: 20px auto 0;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        box-shadow:
          0 10px 15px -3px rgba(0, 0, 0, 0.1),
          0 4px 6px -2px rgba(0, 0, 0, 0.05);
        background-color: #ffffff;
      }

      /* Konva Stage overlaps on the container */
      #konva-container {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 20;
      }

      /* Large scroll container for driving scroll events */
      #scroll-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: scroll;
        z-index: 10;
      }

      /* Virtual content block to hold the scrollbar */
      #virtual-content {
        pointer-events: none;
      }

      /* Cell editor styles */
      .cell-editor {
        position: absolute;
        z-index: 30; /* Ensure it's above Konva */
        border: 2px solid #10B981;
        outline: none;
        padding: 0 8px;
        margin: 0;
        box-sizing: border-box;
        font-size: 12px;
        box-sizing: border-box;
        resize: none; /* Disable user resizing */
        overflow: hidden; /* Prevent internal scrollbar during editing */
      }
      .cell-editor.hidden {
        display: none;
      }
    </style>
  </head>
  <body class="bg-gray-100 font-sans antialiased">
    <div id="container" class="overflow-hidden">
      <!-- Konva Stage container -->
      <div id="konva-container"></div>

      <!-- Scroll container -->
      <div id="scroll-container">
        <!-- Virtual content block, its size determines the scroll range -->
        <div id="virtual-content"></div>
      </div>
    </div>

    <div class="text-center mt-4 text-gray-600">
      <p>Virtual Scroll Demo: Total Rows <span id="total-rows"></span>, Total Columns <span id="total-cols"></span>.</p>
      <p class="font-bold text-indigo-600">
        Frozen Row <span id="frozen-rows-count">1</span> (<span id="frozen-row-height">30px</span>) and Column
        <span id="frozen-cols-count">1</span>.
      </p>
      <p>
        Current render range: Row <span id="rendered-range-row"></span>, Column
        <span id="rendered-range-col"></span>
      </p>
      <p>Scroll: X=<span id="scroll-x">0</span>, Y=<span id="scroll-y">0</span></p>
      <p>Selection Ranges: <span id="selection-count">0</span></p>
    </div>
    <textarea id="cell-editor" class="cell-editor hidden"></textarea>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
